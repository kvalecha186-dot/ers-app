plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.ers'
    compileSdk 36

    defaultConfig {
        applicationId "com.ers"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Required so JavaMail's license files don't conflict with
    // other JARs during the merge step
    packagingOptions {
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.play.services.location
    implementation libs.recyclerview
    implementation libs.viewpager2
    implementation 'com.github.fornewid:neumorphism:0.3.0'

    // Google Sign-In + Drive (for Google Drive auto-backup)
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // JavaMail — silent SMTP email when emergency triggers (no user interaction)
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
