name: ERS Android CI

on:
  push:
    branches: [main]
    paths:
      - 'ers app zip file manan/ERSPROJECT/AndroidStudioProjects/ERS/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ers app zip file manan/ERSPROJECT/AndroidStudioProjects/ERS/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: ers app zip file manan/ERSPROJECT/AndroidStudioProjects/ERS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and assemble debug APK
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ers-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
