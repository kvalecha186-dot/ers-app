name: Android build

on:
  push:
    branches: [main, portfolio-completion-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ers app zip file manan/ERSPROJECT/AndroidStudioProjects/ERS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ers-debug-apk
          path: ers app zip file manan/ERSPROJECT/AndroidStudioProjects/ERS/app/build/outputs/apk/debug/*.apk
